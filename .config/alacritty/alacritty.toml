[general]
import = ["flow_theme.toml"]

[env]
EDITOR = "nvim"
TERMINAL = "alacritty"
BROWSER = "qutebrowser"
TERM = "xterm-256color"

[window]
decorations = "Full"
dynamic_padding = false

[font]
normal = { family = "Iosevka Fox", style = "Regular" }
bold = { family = "Iosevka Fox", style = "Bold" }
italic = { family = "Iosevka Fox", style = "Italic" }
bold_italic = { family = "Iosevka Fox", style = "Bold Italic" }
size = 11
builtin_box_drawing = true

[terminal]
